# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  allowlist_external_dirs:
    - /config

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


# Example configuration.yaml entry
evohome:
  username: !secret legacy_username
  password: !secret legacy_password


logger:
  default: critical
  logs:
    # log level for HA core
    homeassistant.core: fatal

recorder:
  exclude:
    domains:
      - device_tracker
      - media_player
      - uptime
      - time_date
      - automation
      - worldclock
    entity_globs:
      - sensor.clock*
      - sensor.date*
      - sensor.glances*
      - sensor.load_*m
      - sensor.time*
      - sensor.uptime*
    entities:
      #- camera.front_door
      - sensor.home_assistant_v2_db
      - sensor.memory_free
      - sensor.memory_use
      - sensor.memory_use_percent
      - sensor.processor_use
      #- weather.openweathermap
    event_types:
      - state_changed
      - lovelace_updated
      - hacs*

sensor:

  - platform: sql
    scan_interval: 600
    queries:
      - name: Database Size
        query: "SELECT ROUND(page_count * page_size,1)/1000000 as size FROM pragma_page_count(), pragma_page_size();"
        column: "size"
        unit_of_measurement: MB


#  - platform: filesize
#    file_paths:
#      - /config/home-assistant_v2.db

  - platform: solaredge_local
    name: SolarEdge
    ip_address: !secret legacy_host

#  - platform: jumbo
#    username: !secret legacy_username
#    password: !secret legacy_password
#    type: "both"


#  - platform: p2000
#    icon: mdi:fire-truck
#    nolocation: true
#    name: p2000
#    regios: 10
#    radius: 10000
#    scan_interval: 10
#    latitude: !secret legacy_latitude
#    longitude: !secret legacy_longitude

  - platform: afvalwijzer
    provider: mijnafvalwijzer        # (required, default = mijnafvalwijzer) either choose mijnafvalwijzer, afvalstoffendienstkalender or rova
    postal_code: !secret legacy_postal_code
    street_number:  !secret legacy_street_number
    suffix: ''                       # (optional, default = '')
    exclude_pickup_today: true       # (optional, default = true) to take or not to take Today into account in the next pickup.
    default_label: geen              # (optional, default = geen) label if no date found
    id: ''                           # (optional, default = '') use if you'd like to have multiple waste pickup locations in HASS
    exclude_list: ''                 # (optional, default = '') comma separated list of waste types (case ignored). F.e. "papier, gft"7

