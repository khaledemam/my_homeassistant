input_boolean:
  waste_moved:
    name: Waste has been moved
    initial: 'off'
    icon: mdi:delete-empty
  waste_reminder:
    name: Waste reminder enabled
    initial: 'on'


light:
  - platform: template
    lights:
      bookshelf:
        turn_on:
          service: script.bookshelf_on
        turn_off:
          service: script.bookshelf_off

#ecovacs:
#  username: !secret legacy_username
